name: maven-open-source-verify
on:
  workflow_call:
    inputs:
      java-version:
        description: "Java Runtime Version. A bare major (17, 21, 25) is mapped to the patched build; see the safe-java-version action."
        required: false
        type: string
        default: "25"
      commands:
        description: "Maven command"
        required: false
        type: string
        default: "-B clean verify --update-snapshots"
      runs-on:
        description: "Runner"
        required: false
        type: string
        default: "ubuntu-24.04"
      java-distribution:
        description: "Java distribution for setup-java"
        required: false
        type: string
        default: "liberica"

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve safe Java version
        id: java
        uses: $/.github/actions/safe-java-version
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - name: Set up Java ${{ steps.java.outputs.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ steps.java.outputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - name: Load Maven cache
        uses: $/.github/actions/load-maven-cache
      - name: Verify
        run: |
          mvn ${{ inputs.commands }}
      - name: Print error reports
        if: failure()
        run: |
          readarray -d '' reports < <(find . -wholename "*/target/surefire-reports/*.txt" -print0)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No surefire reports found"
          else
            errorOrFailureReports=()
            for report in "${reports[@]}"; do
              if ! grep -q 'Failures: 0, Errors: 0' $report; then
                errorOrFailureReports+=($report)
              fi
            done
            errorOrFailureReportCount=${#errorOrFailureReports[@]}
            if [ "$errorOrFailureReportCount" -gt "10" ]; then
              echo ":rotating_light: Printing first 10 of $errorOrFailureReportCount unit test files with failure(s) and/or error(s)." >> $GITHUB_STEP_SUMMARY
              for i in {0..10}
              do
                cat "${errorOrFailureReports[$i]}" >> $GITHUB_STEP_SUMMARY
              done
            else 
              echo ":rotating_light: Found $errorOrFailureReportCount unit test files with failure(s) and/or error(s)." >> $GITHUB_STEP_SUMMARY
              for report in "${errorOrFailureReports[@]}"; do
                cat "$report" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: surefire-reports-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/"
