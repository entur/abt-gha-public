name: gradle-open-source-verify
on:
  workflow_call:
    inputs:
      java-version:
        description: "Java Runtime Version"
        required: false
        type: string
        default: 21
      tasks:
        description: "Gradle task parameters"
        required: false
        type: string
        default: build
      log-level:
        description: "Gradle log level"
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner"
        required: false
        type: string
        default: "ubuntu-24.04"
      java-distribution:
        description: "Java distribution for setup-java"
        required: false
        type: string
        default: "liberica"
jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build with Gradle Wrapper
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
        run: |
          GRADLE_LOG_ARGUMENT=""
          # detect log level      
          if [ "$LOG_LEVEL" = "info" ]; then
            GRADLE_LOG_ARGUMENT="--info"
          elif [ "$LOG_LEVEL" = "debug" ]; then
            GRADLE_LOG_ARGUMENT="--debug"
          elif [ "$LOG_LEVEL" = "warn" ]; then
            GRADLE_LOG_ARGUMENT="--warn"
          fi
          ./gradlew ${{ inputs.tasks }} $GRADLE_LOG_ARGUMENT --stacktrace
      - name: Store build reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: reports-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
            path: |
                **/build/reports/
                **/build/test-results/