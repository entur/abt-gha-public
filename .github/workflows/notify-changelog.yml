name: Notify Changelog

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to check last successful deployment for (dev/tst/prd)
        required: true
        type: string
      channel-id:
        description: Slack channel ID to post the changelog notification to
        required: true
        type: string

jobs:
  git-diff-url:
    name: Git Diff URL
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      compare_url: ${{ steps.compare.outputs.compare_url }}
      short_sha: ${{ steps.compare.outputs.short_sha }}
    steps:
      - name: Get compare URL since last successful deployment
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYED_SHA=$(
            gh api "repos/${{ github.repository }}/deployments" \
              -X GET \
              -f environment="${{ inputs.environment }}" \
              -f per_page=20 \
              --jq '.[] | "\(.sha) \(.statuses_url)"' | \
            while IFS=' ' read -r sha statuses_url; do
              # Latest status of this deployment: state + the run that created it.
              info=$(gh api "$statuses_url" --jq '.[0] | "\(.state) \(.log_url)"' 2>/dev/null || true)
              state=${info%% *}
              log_url=${info#* }
              [ "$state" = "success" ] || continue
              # Ignore deployments created by THIS run. A job that declares
              # environment: <env> (e.g. the descriptor upload via
              # upload-file-to-bucket) makes GitHub create a deployment for the
              # current commit before this job runs; its log_url carries our run
              # id, while a real previous release was deployed by a different run.
              # Skipping by run (not by SHA) keeps a re-run of an already-released
              # commit correctly empty.
              status_run=${log_url#*/actions/runs/}
              status_run=${status_run%%/*}
              [ "$status_run" = "$GITHUB_RUN_ID" ] && continue
              echo "$sha"
              break
            done
          )

          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

          if [ -n "$DEPLOYED_SHA" ]; then
            URL="https://github.com/${{ github.repository }}/compare/${DEPLOYED_SHA}...${{ github.sha }}"
            echo "compare_url=$URL" >> $GITHUB_OUTPUT
            echo "$URL"
          else
            echo "No previous successful deployment found for ${{ inputs.environment }}"
          fi

  notify-diff:
    name: Notify Git Diff
    needs: git-diff-url
    if: needs.git-diff-url.outputs.compare_url != ''
    uses: entur/gha-slack/.github/workflows/post.yml@v2
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "📋 New <${{ needs.git-diff-url.outputs.compare_url }}|changelog> for ${{ github.event.repository.name }} ${{ needs.git-diff-url.outputs.short_sha }} in ${{ inputs.environment }}"
    secrets: inherit
