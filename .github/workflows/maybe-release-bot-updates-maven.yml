name: Maybe release bot updates - Maven
# Delegates commit evaluation to the has-bot-updated-main-dependencies-maven-action and
# optionally dispatches the target workflow when a release is warranted.
on:
  workflow_call:
    inputs:
      workflow:
        description: "Workflow filename to dispatch when a release is warranted (e.g. maven-release.yml)."
        required: true
        type: string
      release-branch:
        description: "Branch to check commits against."
        required: false
        type: string
        default: main
      release-prefix:
        description: "Prefix used for release tags."
        required: false
        type: string
        default: "release-"
      trigger-release:
        description: "When true, dispatches the workflow if a release is warranted. When false, only reports."
        required: false
        type: boolean
        default: false
      bot-name:
        description: "Git author name of the bot whose commits are evaluated."
        required: false
        type: string
        default: "dependabot[bot]"
      ignore-plugin-update-commits:
        description: "Treat bot commits that only update Maven plugins as skip-worthy."
        required: false
        type: boolean
        default: true
      ignore-test-dependency-update-commits:
        description: "Treat bot commits that only update test-scoped dependencies as skip-worthy."
        required: false
        type: boolean
        default: true
      java-version:
        description: "Java version used for Maven dependency/plugin analysis."
        required: false
        type: string
        default: "25"
      channel-id:
        description: "Slack channel-id to post notification to."
        required: false
        type: string
        default: ${{ vars.channel_id || 'NO_ID'}}
    outputs:
      should-release:
        description: "true when a release is warranted."
        value: ${{ jobs.check-maven-commits.outputs.should-release }}
      dispatched:
        description: "true when the target workflow was dispatched."
        value: ${{ jobs.check-maven-commits.outputs.dispatched }}
      status-text:
        description: "Human-readable summary of the decision."
        value: ${{ jobs.check-maven-commits.outputs.status-text }}

jobs:
  check-maven-commits:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      should-release: ${{ steps.result.outputs.should-release }}
      dispatched: ${{ steps.result.outputs.dispatched }}
      status-text: ${{ steps.result.outputs.status-text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: liberica

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check if main dependencies have been updated
        id: check
        uses: $/.github/actions/has-bot-updated-main-dependencies-maven-action
        with:
          release-branch: ${{ inputs.release-branch }}
          release-prefix: ${{ inputs.release-prefix }}
          bot-name: ${{ inputs.bot-name }}
          ignore-plugin-update-commits: ${{ inputs.ignore-plugin-update-commits }}
          ignore-test-dependency-update-commits: ${{ inputs.ignore-test-dependency-update-commits }}

      - name: Dispatch release workflow
        id: dispatch
        if: steps.check.outputs.updated == 'true' && inputs.trigger-release == true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$RELEASE_BRANCH"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Set job outputs
        id: result
        if: always()
        env:
          UPDATED: ${{ steps.check.outputs.updated }}
          REASON: ${{ steps.check.outputs.reason }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched || 'false' }}
        run: |
          if [ "$UPDATED" = "true" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dispatched=$DISPATCHED" >> "$GITHUB_OUTPUT"
          echo "status-text=$REASON" >> "$GITHUB_OUTPUT"

  post-to-slack-if-triggered:
    needs: check-maven-commits
    if: success() && needs.check-maven-commits.outputs.dispatched == 'true' && inputs.channel-id != 'NO_ID'
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "🔵 ${{ github.repository }} - Triggered ${{ inputs.workflow }} on ${{ inputs.release-branch }} (${{ needs.check-maven-commits.outputs.status-text }})"
    secrets: inherit

  post-to-slack-if-skipped:
    needs: check-maven-commits
    if: success() && needs.check-maven-commits.outputs.should-release == 'false' && inputs.channel-id != 'NO_ID'
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "⏭️ ${{ github.repository }} - Release skipped: ${{ needs.check-maven-commits.outputs.status-text }}"
    secrets: inherit

  post-fail-to-slack-if-fail:
    needs: check-maven-commits
    if: failure() && inputs.channel-id != 'NO_ID'
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "⚫ ${{ github.repository }} - Maven release check failed for ${{ inputs.workflow }}"
    secrets: inherit
