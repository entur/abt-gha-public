name: Build Jar Maven
on:
  workflow_call:
    secrets:
      ARTIFACTORY_AUTH_USER:
        description: "Artifactory username used to download dependencies"
        required: false
      ARTIFACTORY_AUTH_TOKEN:
        description: "Artifactory token used to download dependencies"
        required: false
      SLACK_BOT_TOKEN:
        description: "Slack bot token for notifications"
        required: false
    inputs:
      java-version:
        description: "Java Runtime Version. A bare major (17, 21, 25) is mapped to the patched build; see the safe-java-version action."
        required: false
        type: string
        default: "25"
      java-distribution:
        description: "Java distribution for setup-java: liberica or temurin. Both have patched builds for 17, 21 and 25 (see the safe-java-version action)."
        required: false
        type: string
        default: "liberica"
      build-profiles:
        description: "Profiles to use for maven build"
        type: string
        required: false
        default: NO_PROFILE
      channel-id:
        description: "Slack channel-id to post notification to"
        required: false
        type: string
        default: ${{ vars.channel_id || 'NO_ID'}}

jobs:
  maven-build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve safe Java version
        id: java
        uses: $/.github/actions/safe-java-version
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - name: Set up JDK ${{ steps.java.outputs.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ steps.java.outputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          server-id: entur-partner
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Maven create jar file (without profile)
        if: inputs.build-profiles == 'NO_PROFILE'
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
        run: |
          mvn -B clean package
      - name: Maven create jar file (with profile)
        if: inputs.build-profiles != 'NO_PROFILE'
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
          BUILD_PROFILES: ${{ inputs.build-profiles }}
        run: |
          mvn -B clean package -P"$BUILD_PROFILES"
      - name: Upload artifact for docker deploy to fetch later.
        run: |
          mkdir libs
          mv target/app.jar libs
          echo "Artifact built and stored, ready for docker deploy step to fetch" >> $GITHUB_STEP_SUMMARY
      - name: Archive Build Artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: libs
          retention-days: 4
          overwrite: true
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: surefire-reports-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/"

  post-fail-to-slack-if-non-pull-request:
    needs: maven-build
    if: failure() && inputs.channel-id != 'NO_ID'
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "🔴 Release build failed for ${{ github.repository }}, requested by ${{ github.actor }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit

