name: Build Jar Maven
on:
  workflow_call:
    inputs:
      java-version:
        description: "Java Runtime Version"
        required: false
        type: string
        default: 25
      channel-id:
        description: "Slack channel-id to post notification to"
        required: false
        type: string
        default: ${{ vars.channel_id || 'NO_ID'}}
      docker-images-properties-file:
        description: "Path (relative to repo root, filename is arbitrary) to a Java .properties file, maintained in the calling project, containing Docker images (e.g. Testcontainers images used by integration tests) to pre-pull in the background before the Maven build starts. Only entries whose key ends in \".docker-image\" (dot or dash are interchangeable in this suffix, e.g. \"-docker-image\", \".docker.image\" and \"-docker.image\" are also accepted) are treated as an image to pull, so unrelated properties can safely live in the same file. Using a Spring-style properties file lets application code load the very same file (e.g. via a small classpath-resource loader) as its single source of truth, instead of duplicating the image list in workflow config. The download overlaps with dependency resolution/compilation instead of blocking the first integration test that needs the image. If the file doesn't exist, this step is skipped."
        type: string
        required: false
        default: "src/main/resources/testcontainers-images.properties"

jobs:
  maven-build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Pre-pull Docker images in background
        uses: $/.github/actions/pre-pull-docker-images
        with:
          docker-images-properties-file: ${{ inputs.docker-images-properties-file }}
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: liberica
          server-id: entur-partner
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Cache Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Maven create jar file (without profile)
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
        run: |
          mvn -B clean verify
      - name: Upload artifact for docker deploy to fetch later.
        run: |
          mkdir libs
          mv target/app.jar libs
          echo "Artifact built and stored, ready for docker deploy step to fetch" >> $GITHUB_STEP_SUMMARY
      - name: Archive Build Artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: libs
          retention-days: 4
          overwrite: true
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: surefire-reports-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/"

  post-fail-to-slack-if-non-pull-request:
    needs: maven-build
    if: failure() && inputs.channel-id != 'NO_ID'
    uses: entur/gha-slack/.github/workflows/post.yml@v2
    with:
      channel_id: ${{ inputs.channel-id }}
      message: "🔴 Release build failed for ${{ github.repository }}, requested by ${{ github.actor }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit

