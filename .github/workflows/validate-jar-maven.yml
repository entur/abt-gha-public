name: validate-maven
on:
  workflow_call:
    inputs:
      java-version:
        description: Java Runtime Version
        required: true
        type: string
      server-id:
        description: Server-id used in pom to reference generated settings.xml
        type: string
        required: false
        default: entur-partner
      automerge-dependabot:
        description: "If PR is from dependabot, should we auto-merge it?"
        type: string
        required: false
        default: false
      upload-artifact:
        description: "Upload artifacts from folder lib after build"
        type: string
        required: false
        default: false
      build-profiles:
        description: "Profiles to use for maven build"
        type: string
        required: false
        default: NO_PROFILE
      build-runner:
        description: "Label of runner to use for maven build. (https://github.com/entur/abt-gha/settings/actions/runners)"
        type: string
        required: false
        default: ubuntu-24.04
      channel-id:
        description: "Slack channel-id to post notification to"
        required: false
        type: string
        default: ${{ vars.channel_id || 'NO_ID'}}

jobs:
  validate-maven-build:
    runs-on: ${{ inputs.build-runner }}
    outputs:
      deploy-message: ${{ steps.autodeploy.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: liberica
          server-id: ${{ inputs.server-id }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Verify (without profile)
        if: inputs.build-profiles == 'NO_PROFILE'
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
        run: |
          mvn -B clean verify
          echo "Validating maven build without profile" >> $GITHUB_STEP_SUMMARY
      - name: Verify (with profile)
        if: inputs.build-profiles != 'NO_PROFILE'
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
        run: |
          mvn -B clean verify -P${{inputs.build-profiles}}
          echo "Validating maven build with profile(s): ${{inputs.build-profiles}}" >> $GITHUB_STEP_SUMMARY
      - name: Print error reports
        if: failure()
        run: |
          readarray -d '' reports < <(find . -wholename "*/target/surefire-reports/*.txt" -print0)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No surefire reports found"
          else
            errorOrFailureReports=()
            for report in "${reports[@]}"; do
              if ! grep -q 'Failures: 0, Errors: 0' $report; then
                errorOrFailureReports+=($report)
              fi
            done
            errorOrFailureReportCount=${#errorOrFailureReports[@]}
            if [ "$errorOrFailureReportCount" -gt "10" ]; then
              echo ":rotating_light: Printing first 10 of $errorOrFailureReportCount unit test files with failure(s) and/or error(s)." >> $GITHUB_STEP_SUMMARY
              for i in {0..10}
              do
                cat "${errorOrFailureReports[$i]}" >> $GITHUB_STEP_SUMMARY
              done
            else 
              echo ":rotating_light: Found $errorOrFailureReportCount unit test files with failure(s) and/or error(s)." >> $GITHUB_STEP_SUMMARY
              for report in "${errorOrFailureReports[@]}"; do
                cat "$report" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: surefire-reports-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/"
      - name: Ready for upload
        if: success() && inputs.upload-artifact == 'true'
        run: |
          mkdir libs
          mv target/app.jar libs
      - name: Archive Build Artifacts
        if: success() && inputs.upload-artifact == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: libs
          retention-days: 4
          overwrite: true

  auto-merge-if-dependabot-not-major:
    needs: validate-maven-build
    uses: $/.github/workflows/auto-merge.yml
    secrets: inherit
    if: >
      success() && inputs.automerge-dependabot == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.head.ref,'auto-merge-')
    with:
      channel-id: ${{ inputs.channel-id }}
