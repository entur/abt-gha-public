name: Maven save cache
description: Saves the Maven repository cache (~/.m2/repository) using the key from maven-restore-cache. Skips if the cache was an exact hit.
inputs:
  cache-primary-key:
    description: "The cache-primary-key output of maven-restore-cache"
    required: true
  cache-hit:
    description: "The cache-hit output of maven-restore-cache"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Save Maven repository cache
      if: inputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ inputs.cache-primary-key }}
