name: Load Maven cache
description: Restores the Maven repository cache (~/.m2/repository), and saves it when the job ends successfully unless save is false.
inputs:
  save:
    description: "Whether to save the Maven repository cache at the end of the job"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether an exact match for the cache key was found"
    value: ${{ steps.restore-save.outputs.cache-hit || steps.restore-only.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore and save Maven repository cache
      id: restore-save
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Restore Maven repository cache
      id: restore-only
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
